media:
  - name: images
    label: Photos / Fotos
    input: media/images
    output: /media/images
    categories: [image]
    rename: safe
  - name: docs
    label: Documents / Documentos
    input: media/docs
    output: /media/docs
    extensions: [pdf]
    rename: safe

content:
  - name: inicio
    label: Home / Inicio
    type: file
    path: content/inicio.yml
    format: yaml
    fields:
      - name: lema
        label: Main sentence (Spanish) / Frase principal (español)
        type: text
        required: true
      - name: tagline
        label: Main sentence (English) / Frase principal (inglés)
        type: text
      - name: titulo_mes
        label: «Every month» heading (Spanish) / Título «Cada mes» (español)
        type: string
      - name: title_month
        label: «Every month» heading (English) / Título «Cada mes» (inglés)
        type: string
      - name: tarjetas
        label: «Every month» cards / Tarjetas «Cada mes»
        type: object
        list: true
        fields:
          - name: titulo
            label: Title (Spanish) / Título (español)
            type: string
          - name: title
            label: Title (English) / Título (inglés)
            type: string
          - name: texto
            label: Text (Spanish) / Texto (español)
            type: text
          - name: text
            label: Text (English) / Texto (inglés)
            type: text

  - name: talleres
    label: Workshops & events / Talleres y eventos
    type: collection
    path: content/talleres
    format: yaml
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}-{primary}.yml"
      field: create
    view:
      fields: [titulo, fecha]
      primary: titulo
      sort: [fecha, titulo]
      default:
        sort: fecha
        order: desc
    fields:
      - name: titulo
        label: Title (Spanish) / Título (español)
        type: string
        required: true
      - name: title
        label: Title (English) / Título (inglés)
        type: string
      - name: fecha
        label: Date and time / Fecha y hora (empty = «to be announced» / vacío = «por anunciar»)
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: lugar
        label: Place / Lugar
        type: string
        default: 231 Clinton Ave., Kingston
      - name: texto
        label: Description (Spanish) / Descripción (español)
        type: text
      - name: text
        label: Description (English) / Descripción (inglés)
        type: text
      - name: imagen
        label: Photo (optional) / Foto (opcional)
        type: image
        options:
          media: images

  - name: galeria
    label: Gallery / Galería
    type: collection
    path: content/galeria
    format: yaml
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.yml"
      field: create
    view:
      fields: [imagen, pie]
      primary: pie
    fields:
      - name: imagen
        label: Photo / Foto
        type: image
        required: true
        options:
          media: images
      - name: pie
        label: Caption (Spanish) / Pie de foto (español)
        type: string
      - name: caption
        label: Caption (English) / Pie de foto (inglés)
        type: string

  - name: testimonios
    label: Testimonials / Testimonios
    type: collection
    path: content/testimonios
    format: yaml
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.yml"
      field: create
    view:
      fields: [cita, autora]
      primary: cita
    fields:
      - name: cita
        label: Quote (Spanish) / Cita (español)
        type: text
        required: true
      - name: quote
        label: Quote (English) / Cita (inglés)
        type: text
      - name: autora
        label: Who said it (Spanish) / Quién lo dice (español)
        type: string
        default: Una participante
      - name: author
        label: Who said it (English) / Quién lo dice (inglés)
        type: string
        default: A participant

  - name: informes
    label: Reports / Informes (flipbook)
    type: collection
    path: content/informes
    format: yaml
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}-{primary}.yml"
      field: create
    view:
      fields: [titulo, activo]
      primary: titulo
    fields:
      - name: activo
        label: Active (shown on the site) / Activo (se muestra en el sitio)
        type: boolean
        description: "The site shows one report at a time. If several are marked active, the newest one is shown; if none is active, the flipbook is hidden. / El sitio muestra un solo informe a la vez. Si marcas varios como activos, se muestra el más reciente; si no hay ninguno activo, el flipbook no aparece."
        default: false
      - name: titulo
        label: Title (Spanish) / Título (español)
        type: string
        required: true
      - name: title
        label: Title (English) / Título (inglés)
        type: string
      - name: intro
        label: Introduction (Spanish) / Introducción (español)
        type: text
      - name: intro_en
        label: Introduction (English) / Introducción (inglés)
        type: text
      - name: pdf_es
        label: Report in Spanish / Informe en español (PDF)
        description: "If you upload only one of the two, it is used for both languages. / Si subes solo uno de los dos, se usa para ambos idiomas."
        type: file
        options:
          media: docs
          extensions: [pdf]
      - name: pdf_en
        label: Report in English / Informe en inglés (PDF)
        description: "If you upload only one of the two, it is used for both languages. / Si subes solo uno de los dos, se usa para ambos idiomas."
        type: file
        options:
          media: docs
          extensions: [pdf]
