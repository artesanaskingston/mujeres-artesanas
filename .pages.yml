media:
  - name: images
    label: Fotos / Photos
    input: media/images
    output: /media/images
    categories: [image]
    rename: safe
  - name: docs
    label: Documentos / Documents
    input: media/docs
    output: /media/docs
    extensions: [pdf]
    rename: safe

content:
  - name: inicio
    label: Inicio / Home
    type: file
    path: content/inicio.yml
    format: yaml
    fields:
      - name: lema
        label: Frase principal (español) / Main sentence (Spanish)
        type: text
        required: true
      - name: tagline
        label: Frase principal (inglés) / Main sentence (English)
        type: text
      - name: titulo_mes
        label: Título «Cada mes» (español) / «Every month» heading (Spanish)
        type: string
      - name: title_month
        label: Título «Cada mes» (inglés) / «Every month» heading (English)
        type: string
      - name: tarjetas
        label: Tarjetas «Cada mes» / «Every month» cards
        type: object
        list: true
        fields:
          - name: titulo
            label: Título (español) / Title (Spanish)
            type: string
          - name: title
            label: Título (inglés) / Title (English)
            type: string
          - name: texto
            label: Texto (español) / Text (Spanish)
            type: text
          - name: text
            label: Texto (inglés) / Text (English)
            type: text

  - name: talleres
    label: Talleres y eventos / Workshops & events
    type: collection
    path: content/talleres
    format: yaml
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}-{primary}.yml"
      field: create
    view:
      fields: [titulo, fecha]
      primary: titulo
      sort: [fecha, titulo]
      default:
        sort: fecha
        order: desc
    fields:
      - name: titulo
        label: Título (español) / Title (Spanish)
        type: string
        required: true
      - name: title
        label: Título (inglés) / Title (English)
        type: string
      - name: fecha
        label: Fecha y hora / Date and time (vacío = «por anunciar» / empty = «to be announced»)
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: lugar
        label: Lugar / Place
        type: string
        default: 231 Clinton Ave., Kingston
      - name: texto
        label: Descripción (español) / Description (Spanish)
        type: text
      - name: text
        label: Descripción (inglés) / Description (English)
        type: text
      - name: imagen
        label: Foto (opcional) / Photo (optional)
        type: image
        options:
          media: images

  - name: galeria
    label: Galería / Gallery
    type: collection
    path: content/galeria
    format: yaml
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.yml"
      field: create
    view:
      fields: [imagen, pie]
      primary: pie
    fields:
      - name: imagen
        label: Foto / Photo
        type: image
        required: true
        options:
          media: images
      - name: pie
        label: Pie de foto (español) / Caption (Spanish)
        type: string
      - name: caption
        label: Pie de foto (inglés) / Caption (English)
        type: string

  - name: testimonios
    label: Testimonios / Testimonials
    type: collection
    path: content/testimonios
    format: yaml
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.yml"
      field: create
    view:
      fields: [cita, autora]
      primary: cita
    fields:
      - name: cita
        label: Cita (español) / Quote (Spanish)
        type: text
        required: true
      - name: quote
        label: Cita (inglés) / Quote (English)
        type: text
      - name: autora
        label: Quién lo dice (español) / Who said it (Spanish)
        type: string
        default: Una participante
      - name: author
        label: Quién lo dice (inglés) / Who said it (English)
        type: string
        default: A participant

  - name: informes
    label: Informes / Reports (flipbook)
    type: collection
    path: content/informes
    format: yaml
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}-{primary}.yml"
      field: create
    view:
      fields: [titulo, activo]
      primary: titulo
    fields:
      - name: activo
        label: Activo (se muestra en el sitio) / Active (shown on the site)
        type: boolean
        description: "El sitio muestra un solo informe a la vez. Si marcas varios como activos, se muestra el más reciente; si no hay ninguno activo, el flipbook no aparece. / The site shows one report at a time. If several are marked active, the newest one is shown; if none is active, the flipbook is hidden."
        default: false
      - name: titulo
        label: Título (español) / Title (Spanish)
        type: string
        required: true
      - name: title
        label: Título (inglés) / Title (English)
        type: string
      - name: intro
        label: Introducción (español) / Introduction (Spanish)
        type: text
      - name: intro_en
        label: Introducción (inglés) / Introduction (English)
        type: text
      - name: pdf_es
        label: Informe en español / Report in Spanish (PDF)
        description: "Si subes solo uno de los dos, se usa para ambos idiomas. / If you upload only one of the two, it is used for both languages."
        type: file
        options:
          media: docs
          extensions: [pdf]
      - name: pdf_en
        label: Informe en inglés / Report in English (PDF)
        description: "Si subes solo uno de los dos, se usa para ambos idiomas. / If you upload only one of the two, it is used for both languages."
        type: file
        options:
          media: docs
          extensions: [pdf]
