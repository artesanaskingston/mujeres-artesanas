media:
  - name: images
    label: Photos / Fotos
    input: media/images
    output: /media/images
    categories: [image]
    rename: safe
  - name: docs
    label: Documents / Documentos
    input: media/docs
    output: /media/docs
    extensions: [pdf]
    rename: safe

content:
  - name: inicio
    label: Home / Inicio
    type: file
    path: content/inicio.yml
    format: yaml
    fields:
      - name: lema
        label: Main sentence (Spanish) / Frase principal (español)
        type: text
        required: true
      - name: tagline
        label: Main sentence (English) / Frase principal (inglés)
        type: text
      - name: titulo_mes
        label: «Every month» heading (Spanish) / Título «Cada mes» (español)
        type: string
      - name: title_month
        label: «Every month» heading (English) / Título «Cada mes» (inglés)
        type: string
      - name: tarjetas
        label: «Every month» cards / Tarjetas «Cada mes»
        type: object
        list: true
        fields:
          - name: titulo
            label: Title (Spanish) / Título (español)
            type: string
          - name: title
            label: Title (English) / Título (inglés)
            type: string
          - name: texto
            label: Text (Spanish) / Texto (español)
            type: text
          - name: text
            label: Text (English) / Texto (inglés)
            type: text

  - name: encabezados
    label: Page headers / Encabezados
    type: file
    path: content/encabezados.yml
    format: yaml
    fields:
      - name: inicio
        label: Home / Inicio
        type: object
        fields:
          - name: imagen
            label: Photo / Foto
            type: image
            options:
              media: images
          - name: posicion
            label: Which part of the photo stays visible / Qué parte de la foto se ve
            type: select
            options:
              values:
                - value: top
                  label: Top / Arriba
                - value: center
                  label: Center / Centro
                - value: bottom
                  label: Bottom / Abajo
      - name: quienes_somos
        label: About / Quiénes somos
        type: object
        fields:
          - name: imagen
            label: Photo / Foto
            type: image
            options:
              media: images
            description: "Empty = the logo on teal (as now). / Vacío = el logo sobre turquesa (como ahora)."
          - name: posicion
            label: Which part of the photo stays visible / Qué parte de la foto se ve
            type: select
            options:
              values:
                - value: top
                  label: Top / Arriba
                - value: center
                  label: Center / Centro
                - value: bottom
                  label: Bottom / Abajo
      - name: talleres
        label: Workshops & events / Talleres y eventos
        type: object
        fields:
          - name: imagen
            label: Photo / Foto
            type: image
            options:
              media: images
          - name: posicion
            label: Which part of the photo stays visible / Qué parte de la foto se ve
            type: select
            options:
              values:
                - value: top
                  label: Top / Arriba
                - value: center
                  label: Center / Centro
                - value: bottom
                  label: Bottom / Abajo
      - name: galeria
        label: Gallery / Galería
        type: object
        fields:
          - name: imagen
            label: Photo / Foto
            type: image
            options:
              media: images
          - name: posicion
            label: Which part of the photo stays visible / Qué parte de la foto se ve
            type: select
            options:
              values:
                - value: top
                  label: Top / Arriba
                - value: center
                  label: Center / Centro
                - value: bottom
                  label: Bottom / Abajo
#      - name: tienda
#        label: Shop / Tienda
#        type: object
#        fields:
#          - name: imagen
#            label: Photo / Foto
#            type: image
#            options:
#              media: images
#          - name: posicion
#            label: Which part of the photo stays visible / Qué parte de la foto se ve
#            type: select
#            options:
#              values:
#                - value: top
