  - name: testimonios
    label: Testimonials / Testimonios
    type: collection
    path: content/testimonios
    format: yaml
    operations:
      rename: false
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.yml"
      field: false
    view:
      fields: [cita, autora]
      primary: cita
    fields:
      - name: cita
        label: Quote (Spanish) / Cita (español)
        type: text
        required: true
      - name: quote
        label: Quote (English) / Cita (inglés)
        type: text
      - name: autora
        label: Who said it (Spanish) / Quién lo dice (español)
        type: string
        default: Una participante
      - name: author
        label: Who said it (English) / Quién lo dice (inglés)
        type: string
        default: A participant

  - name: informes
    label: Reports / Informes (flipbook)
    type: collection
    path: content/informes
    format: yaml
    operations:
      rename: false
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.yml"
      field: false
    view:
      fields: [titulo, activo]
      primary: titulo
    fields:
      - name: activo
        label: Active (shown on the site) / Activo (se muestra en el sitio)
        type: boolean
        description: "The site shows one report at a time. If several are marked active, the newest one is shown; if none is active, the flipbook is hidden. / El sitio muestra un solo informe a la vez. Si marcas varios como activos, se muestra el más reciente; si no hay ninguno activo, el flipbook no aparece."
        default: false
      - name: titulo
        label: Title (Spanish) / Título (español)
        type: string
        required: true
      - name: title
        label: Title (English) / Título (inglés)
        type: string
      - name: intro
        label: Introduction (Spanish) / Introducción (español)
        type: rich-text
        options:
          format: html
          media: false
          switcher: false
      - name: intro_en
        label: Introduction (English) / Introducción (inglés)
        type: rich-text
        options:
          format: html
          media: false
          switcher: false
      - name: pdf_es
        label: Report in Spanish / Informe en español (PDF)
        description: "If you upload only one of the two, it is used for both languages. / Si subes solo uno de los dos, se usa para ambos idiomas."
        type: file
        options:
          media: docs
          extensions: [pdf]
      - name: pdf_en
        label: Report in English / Informe en inglés (PDF)
        description: "If you upload only one of the two, it is used for both languages. / Si subes solo uno de los dos, se usa para ambos idiomas."
        type: file
        options:
          media: docs
          extensions: [pdf]
