#                - value: center
#                  label: Center / Centro
#                - value: bottom
#                  label: Bottom / Abajo
      - name: apoyo
        label: Support & contact / Apoyo y contacto
        type: object
        fields:
          - name: imagen
            label: Photo / Foto
            type: image
            options:
              media: images
            description: "Empty = the eye on yellow (as now). / Vacío = el ojo sobre amarillo (como ahora)."
          - name: posicion
            label: Which part of the photo stays visible / Qué parte de la foto se ve
            type: select
            options:
              values:
                - value: top
                  label: Top / Arriba
                - value: center
                  label: Center / Centro
                - value: bottom
                  label: Bottom / Abajo

  - name: talleres
    label: Workshops & events / Talleres y eventos
    type: collection
    path: content/talleres
    format: yaml
    operations:
      rename: false
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.yml"
      field: false
    view:
      fields: [titulo, fecha]
      primary: titulo
      sort: [fecha, titulo]
      default:
        sort: fecha
        order: desc
    fields:
      - name: titulo
        label: Title (Spanish) / Título (español)
        type: string
        required: true
      - name: title
        label: Title (English) / Título (inglés)
        type: string
      - name: fecha
        label: Date and time / Fecha y hora (empty = «to be announced» / vacío = «por anunciar»)
        type: date
        default: ""
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: lugar
        label: Place / Lugar
        type: string
        default: 231 Clinton Ave., Kingston
      - name: texto
        label: Description (Spanish) / Descripción (español)
        type: rich-text
        options:
          format: html
          media: false
          switcher: false
      - name: text
        label: Description (English) / Descripción (inglés)
        type: rich-text
        options:
          format: html
          media: false
          switcher: false
      - name: imagen
        label: Photo (optional) / Foto (opcional)
        type: image
        options:
          media: images

  - name: galeria
    label: Gallery / Galería
    type: collection
    path: content/galeria
    format: yaml
    operations:
      rename: false
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.yml"
      field: false
    view:
      fields: [imagen, pie]
      primary: pie
    fields:
      - name: imagen
        label: Photo / Foto
        type: image
        required: true
        options:
          media: images
      - name: pie
        label: Caption (Spanish) / Pie de foto (español)
        type: string
      - name: caption
        label: Caption (English) / Pie de foto (inglés)
        type: string
      - name: grupo
        label: Group (optional) / Grupo (opcional)
        description: "Pick a group to show this photo under a filter button at the top of the gallery. New groups are made under Gallery groups. / Elige un grupo para mostrar esta foto bajo un botón de filtro arriba de la galería. Los grupos nuevos se crean en Grupos de la galería."
        type: reference
        options:
          collection: galeria_grupos
          value: "{path}"
          label: "{nombre} / {name}"

  - name: galeria_grupos
    label: Gallery groups / Grupos de la galería
    description: "Optional. Each group becomes a filter button above the gallery (only once at least one photo uses it). Newest group first. / Opcional. Cada grupo se convierte en un botón de filtro sobre la galería (solo cuando al menos una foto lo usa). El grupo más nuevo primero."
    type: collection
    path: content/galeria-grupos
    format: yaml
    operations:
      rename: false
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.yml"
      field: false
    view:
      fields: [nombre, name]
      primary: nombre
    fields:
      - name: nombre
        label: Group name (Spanish) / Nombre del grupo (español)
        description: "Short, e.g. \"Cerámica, marzo 2026\". / Corto, p. ej. \"Cerámica, marzo 2026\"."
        type: string
        required: true
      - name: name
        label: Group name (English) / Nombre del grupo (inglés)
        type: string

