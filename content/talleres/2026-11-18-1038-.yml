titulo: Taller de tejido navideño
title: Holiday weaving workshop
fecha: 2026-12-13T11:00
lugar: 231 Clinton Ave., Kingston
texto: <p><strong>¡Teje, Crea y Celebra!</strong></p><p>¡Sumérgete en el
  espíritu de las fiestas con un taller de tejido lleno de creatividad y
  diversión! Acompáñanos en una experiencia acogedora donde descubrirás el arte
  del tejido y crearás tu propia decoración festiva hecha a mano para llevar a
  casa.</p><p>No importa si eres principiante o tienes experiencia en
  manualidades, ¡todos son bienvenidos! Disfruta de un ambiente relajado y
  alegre, descubre nuevas habilidades creativas y dale un toque artesanal y
  personal a esta temporada festiva.</p><p>✨ Todos los materiales están
  incluidos. No necesitas experiencia previa, ¡solo traer tus ganas de
  crear!</p><p><strong>¡Tejamos juntos la magia de las fiestas!</strong></p>
text: <p><strong>Weave, Create &amp; Celebrate!</strong></p><p>Get into the
  holiday spirit with a cozy, creative weaving workshop! Join us for a
  fun-filled experience where you'll explore the art of weaving and create your
  own festive handmade decoration to take home.</p><p>Whether you're a beginner
  or a crafting enthusiast, everyone is welcome! Enjoy a relaxed, joyful
  atmosphere, discover new creative skills, and add a personal handmade touch to
  your holiday season.</p><p>✨ All materials provided. No experience needed —
  just bring your creativity!</p><p><strong>Let's weave some holiday magic
  together!</strong></p>
