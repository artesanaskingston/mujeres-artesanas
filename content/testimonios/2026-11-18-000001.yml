cita: "Me parece maravilloso ver que tenemos un espacio donde, con toda la locura que tenemos —trabajo, hijos, lo que sea—, podemos ir y tener tiempo para nosotras, y no solo eso, sino para nuestro lado emocional, que muchas mujeres hispanas no pueden mostrar en ningún otro lugar."
quote: "I think it's wonderful to see how we have a space where, from all the craziness we have—work, kids, whatever—we can go and have time for ourselves, and not only that, but for our emotional side, which many Hispanic women aren't able to show anywhere else."
autora: Una participante
author: A participant
