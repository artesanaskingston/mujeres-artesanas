cita: "Después del taller compartimos un momento con la comida que nos traen. Es muy significativo porque te da tranquilidad. Te sientes en paz, tranquila, conviviendo con un grupo de personas."
quote: "After the workshop, we share a moment together with food that is brought for us. It is very meaningful because it brings you tranquility. You feel at peace, calm, socializing with a group of people."
autora: Una participante
author: A participant
