cita: "Recordé cosas de hace mucho tiempo, lo que me enseñaron mis antepasadas, como tejer. Tejía con mi abuela y lo dejé por mucho tiempo, sobre todo aquí en Estados Unidos, por el trabajo. Ese espacio me dio un lugar, un tiempo solo para mí, para pensar que yo también existo y lo merezco."
quote: "I remembered things from long ago, like what my ancestors taught me, like knitting. I used to knit with my grandmother, and I stopped for a very long time, mostly here in the United States, because of the time one spends working. That space gave me a place, a time just for myself, to think that I also exist and I deserve it."
autora: Una participante
author: A participant
